context:
  name: bashplotlib
  version: 0.6.5

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b1b59be49d6254a5bd808919e0a23a75a703a02e7e84478edda765714e0bfaee

build:
  noarch: python
  number: 1
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - hist=bashplotlib.histogram:main
      - scatter=bashplotlib.scatterplot:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - bashplotlib
        - bashplotlib.utils
      pip_check: false
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - hist --help
      - scatter --help

about:
  homepage: https://github.com/glamp/bashplotlib
  license: MIT
  license_file: LICENSE.txt
  summary: plotting in the terminal
  description: |
    bashplotlib is a python package and command line tool for making
    basic plots in the terminal. It's a quick way to visualize data when
    you don't have a GUI. It's written in pure python and can quickly
    be installed anywhere using pip.
  documentation: https://github.com/glamp/bashplotlib
  repository: https://github.com/glamp/bashplotlib

extra:
  recipe-maintainers:
    - CurtLH
